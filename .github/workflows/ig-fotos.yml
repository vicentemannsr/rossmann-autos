name: Descargar fotos para Instagram
on:
  push:
    branches: [ig-fotos]
    paths: [ig/pedido.txt]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fotos de ChileAutos
        run: |
          rm -rf ig/fotos && mkdir -p ig/fotos
          n=0
          while read -r id; do
            [ -z "$id" ] && continue
            n=$((n+1))
            curl -fsSL -o "ig/fotos/$(printf '%02d' $n).jpg" "https://chileautos.pxcrush.net/cars/dealer/${id}.jpg?width=1440"
          done < ig/pedido.txt
          ls -la ig/fotos
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ig/fotos
          git commit -m "Fotos descargadas para Instagram" || exit 0
          git push
